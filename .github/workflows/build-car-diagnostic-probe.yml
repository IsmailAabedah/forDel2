name: Build Car Diagnostic Probe APK (Legacy Android)

on:
  workflow_dispatch:
  push:
    paths:
      - 'CarDiagnosticProbe/**'
      - '.github/workflows/build-car-diagnostic-probe.yml'

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - name: Set up Gradle 5.6.4
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '5.6.4'
      - name: Install Android SDK 28
        uses: android-actions/setup-android@v3
      - name: Build legacy APK
        run: gradle --no-daemon --stacktrace -p CarDiagnosticProbe :app:assembleDebug
      - name: Verify APK archive and signature
        run: |
          test -s CarDiagnosticProbe/app/build/outputs/apk/debug/app-debug.apk
          unzip -t CarDiagnosticProbe/app/build/outputs/apk/debug/app-debug.apk
          jarsigner -verify CarDiagnosticProbe/app/build/outputs/apk/debug/app-debug.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ZhongHong-Diagnostic-Probe-APK-v1.3
          path: CarDiagnosticProbe/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
