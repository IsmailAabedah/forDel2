name: Build Car Diagnostic Probe APK (Legacy Android)

on:
  workflow_dispatch:
  push:
    paths:
      - 'CarDiagnosticProbe/**'
      - '.github/workflows/build-car-diagnostic-probe.yml'

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # The Android SDK manager on this runner contains Java 11 bytecode.
      - name: Set up Java 11 for Android SDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '11'

      - name: Install Android SDK 28
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME" -name sdkmanager -type f | head -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" "platforms;android-28" "build-tools;28.0.3"

      # Keep the legacy Android Gradle Plugin on Java 8 for this API 25 target.
      - name: Set up Java 8 for legacy Gradle
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '8'

      - name: Set up Gradle 5.6.4
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '5.6.4'

      - name: Build legacy APK
        run: |
          java -version
          gradle --no-daemon --stacktrace -p CarDiagnosticProbe :app:assembleDebug

      - name: Verify APK archive and signature
        run: |
          APK=CarDiagnosticProbe/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK"
          jarsigner -verify "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ZhongHong-Diagnostic-Probe-APK-v1.3
          path: CarDiagnosticProbe/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
