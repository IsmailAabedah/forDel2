plugins {
    id 'com.android.application'
}

android {
    signingConfigs {
        debug {
            v1SigningEnabled true
            v2SigningEnabled false
        }
    }
    namespace 'com.ismail.carprobe'
    compileSdk 35

    defaultConfig {
        applicationId 'com.ismail.carprobe'
        minSdk 21
        targetSdk 22
        versionCode 3
        versionName '1.2'
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
