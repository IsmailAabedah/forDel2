plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ismail.carprobe'
    compileSdk 35

    defaultConfig {
        applicationId 'com.ismail.carprobe'
        minSdk 23
        targetSdk 28
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}
